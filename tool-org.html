<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ImageRip</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap');
  :root { --bg:#0a0a0a; --surface:#111; --border:#222; --accent:#e8ff47; --text:#f0f0f0; --muted:#555; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:'Space Mono',monospace; min-height:100vh; }
  body::before { content:''; position:fixed; inset:0; background-image:linear-gradient(rgba(232,255,71,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(232,255,71,.025) 1px,transparent 1px); background-size:40px 40px; pointer-events:none; z-index:0; }
  .container { max-width:980px; margin:0 auto; padding:48px 24px 100px; position:relative; z-index:1; }
  h1 { font-family:'Syne',sans-serif; font-weight:800; font-size:clamp(2.4rem,6vw,4rem); letter-spacing:-2px; color:var(--accent); line-height:1; }
  .tagline { font-size:.7rem; color:var(--muted); letter-spacing:.12em; text-transform:uppercase; margin:4px 0 36px; }
  .input-row { display:flex; border:1px solid var(--border); background:var(--surface); transition:border-color .2s; margin-bottom:8px; }
  .input-row:focus-within { border-color:var(--accent); }
  #urlInput { flex:1; background:transparent; border:none; outline:none; padding:14px 18px; font-family:'Space Mono',monospace; font-size:.9rem; color:var(--text); }
  #urlInput::placeholder { color:var(--muted); }
  #fetchBtn { background:var(--accent); color:#000; border:none; padding:14px 28px; font-family:'Syne',sans-serif; font-weight:700; font-size:.85rem; letter-spacing:.05em; cursor:pointer; text-transform:uppercase; transition:background .15s; }
  #fetchBtn:hover { background:#fff; }
  #fetchBtn:disabled { background:var(--muted); color:#333; cursor:not-allowed; }
  .hint { font-size:.68rem; color:var(--muted); margin-bottom:28px; line-height:1.7; }
  #status { font-size:.78rem; padding:10px 14px; border-left:3px solid var(--accent); background:rgba(232,255,71,.05); margin-bottom:20px; display:none; font-style:italic; }
  #status.error { border-color:#f44; background:rgba(255,68,68,.05); color:#f88; }
  #status.show { display:block; }
  #progressBar { height:2px; background:var(--border); margin-bottom:28px; display:none; }
  #progressBar.show { display:block; }
  #progressFill { height:100%; background:var(--accent); width:0%; transition:width .3s ease; }
  .section-label { font-family:'Syne',sans-serif; font-size:.62rem; letter-spacing:.2em; text-transform:uppercase; color:var(--muted); margin-bottom:12px; display:flex; align-items:center; gap:10px; }
  .section-label::after { content:''; flex:1; height:1px; background:var(--border); }
  .image-section { margin-bottom:40px; }
  .card-grid { display:grid; gap:8px; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); }
  .img-card { background:var(--surface); border:1px solid var(--border); position:relative; overflow:hidden; cursor:pointer; transition:border-color .15s,transform .15s; aspect-ratio:1; }
  .img-card:hover { border-color:var(--accent); transform:scale(1.02); }
  .img-card.selected { border-color:var(--accent); outline:2px solid var(--accent); outline-offset:-2px; }
  .img-card.selected::after { content:'✓'; position:absolute; top:6px; right:6px; background:var(--accent); color:#000; font-family:'Syne',sans-serif; font-weight:700; font-size:.7rem; width:20px; height:20px; border-radius:50%; display:flex; align-items:center; justify-content:center; line-height:20px; text-align:center; }
  .img-card img { width:100%; height:100%; object-fit:contain; padding:4px; display:block; }
  .img-card .badge { position:absolute; bottom:0; left:0; right:0; background:rgba(0,0,0,.8); font-size:.55rem; padding:3px 5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; opacity:0; transition:opacity .2s; }
  .img-card:hover .badge { opacity:1; }
  .logo-wrap { display:flex; flex-wrap:wrap; gap:8px; }
  .logo-card { background:#fff; border:1px solid var(--border); padding:12px 20px; min-width:120px; max-width:220px; min-height:70px; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:border-color .15s; position:relative; }
  .logo-card:hover { border-color:var(--accent); }
  .logo-card.selected { border-color:var(--accent); outline:2px solid var(--accent); outline-offset:-2px; }
  .logo-card.selected::after { content:'✓'; position:absolute; top:4px; right:4px; background:var(--accent); color:#000; font-family:'Syne',sans-serif; font-weight:700; font-size:.7rem; width:18px; height:18px; border-radius:50%; display:flex; align-items:center; justify-content:center; line-height:18px; text-align:center; }
  .logo-card img { max-width:100%; max-height:70px; object-fit:contain; }
  .empty-msg { color:var(--muted); font-size:.78rem; font-style:italic; padding:12px 0; }
  #downloadBar { position:fixed; bottom:0; left:0; right:0; background:#111; border-top:1px solid var(--border); padding:14px 24px; display:none; align-items:center; gap:14px; z-index:100; }
  #downloadBar.show { display:flex; }
  #selCount { flex:1; font-size:.78rem; color:var(--muted); }
  #selCount span { color:var(--accent); font-weight:700; }
  #selectAllBtn { background:transparent; color:var(--accent); border:1px solid var(--accent); padding:10px 18px; font-family:'Syne',sans-serif; font-size:.75rem; cursor:pointer; transition:background .15s,color .15s; text-transform:uppercase; letter-spacing:.05em; }
  #selectAllBtn:hover { background:var(--accent); color:#000; }
  #downloadBtn { background:var(--accent); color:#000; border:none; padding:10px 26px; font-family:'Syne',sans-serif; font-weight:700; font-size:.85rem; letter-spacing:.05em; text-transform:uppercase; cursor:pointer; transition:background .15s; }
  #downloadBtn:hover { background:#fff; }
  #downloadBtn:disabled { background:var(--muted); cursor:not-allowed; }
  .spinner { display:inline-block; width:11px; height:11px; border:2px solid var(--muted); border-top-color:var(--accent); border-radius:50%; animation:spin .6s linear infinite; vertical-align:middle; margin-right:6px; }
  @keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<div class="container">
  <h1>ImageRip</h1>
  <p class="tagline">// estrai logo · cover · galleria da qualsiasi sito → ZIP</p>
  <div class="input-row">
    <input type="text" id="urlInput" placeholder="https://esempio.com" autocomplete="off" spellcheck="false"/>
    <button id="fetchBtn" onclick="startFetch()">Analizza →</button>
  </div>
  <p class="hint">Server locale attivo — nessun limite CORS.<br>Inserisci l'URL e le immagini vengono estratte e classificate automaticamente.</p>
  <div id="status"></div>
  <div id="progressBar"><div id="progressFill"></div></div>
  <div id="results" style="display:none">
    <div class="image-section">
      <p class="section-label">Logo rilevato</p>
      <div id="logoContainer" class="logo-wrap"></div>
    </div>
    <div class="image-section">
      <p class="section-label">Immagine copertina (Open Graph / hero)</p>
      <div id="coverContainer" class="card-grid"></div>
    </div>
    <div class="image-section">
      <p class="section-label">Galleria immagini</p>
      <div id="galleryContainer" class="card-grid"></div>
    </div>
  </div>
</div>
<div id="downloadBar">
  <div id="selCount"><span id="selNum">0</span> immagini selezionate</div>
  <button id="selectAllBtn" onclick="toggleSelectAll()">Seleziona tutto</button>
  <button id="downloadBtn" onclick="downloadZip()">⬇ Scarica ZIP</button>
</div>

<script>
let allImages = [];
let selectedImages = new Set();
let allSelected = false;

const PROXY = url => `/proxy?url=${encodeURIComponent(url)}`;

function setStatus(msg, isError=false) {
  const el = document.getElementById('status');
  el.innerHTML = msg;
  el.className = 'show' + (isError ? ' error' : '');
}

function setProgress(pct) {
  const bar = document.getElementById('progressBar');
  if (pct === null) { bar.classList.remove('show'); return; }
  bar.classList.add('show');
  document.getElementById('progressFill').style.width = pct + '%';
}

// FIX CHIAVE: usa getAttribute() per leggere il valore RAW dell'attributo
// (non .src che il browser risolve su localhost automaticamente)
function rawAttr(el, ...attrs) {
  for (const a of attrs) {
    const v = el.getAttribute(a);
    if (v && !v.startsWith('data:') && !v.startsWith('blob:')) return v;
  }
  return null;
}

function resolveUrl(src, base) {
  if (!src) return null;
  src = src.trim();
  if (!src || src.startsWith('data:') || src.startsWith('blob:')) return null;
  try {
    const u = new URL(src, base);
    // Scarta URL che puntano a localhost (sicurezza anti-loop)
    if (u.hostname === 'localhost' || u.hostname === '127.0.0.1') return null;
    return u.href;
  } catch { return null; }
}

async function startFetch() {
  let url = document.getElementById('urlInput').value.trim();
  if (!url) return;
  if (!/^https?:\/\//i.test(url)) url = 'https://' + url;

  document.getElementById('fetchBtn').disabled = true;
  document.getElementById('results').style.display = 'none';
  document.getElementById('downloadBar').classList.remove('show');
  allImages = []; selectedImages.clear(); allSelected = false;
  document.getElementById('selectAllBtn').textContent = 'Seleziona tutto';

  setProgress(5);
  setStatus('<span class="spinner"></span>Scaricando la pagina…');

  let html;
  try {
    const resp = await fetch(PROXY(url));
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    html = await resp.text();
  } catch(e) {
    setStatus('❌ Errore: ' + e.message + ' — assicurati che server.py sia in esecuzione.', true);
    setProgress(null);
    document.getElementById('fetchBtn').disabled = false;
    return;
  }

  setProgress(25);
  setStatus('<span class="spinner"></span>Analizzando le immagini…');

  const parser = new DOMParser();
  const doc = parser.parseFromString(html, 'text/html');
  // base = URL del sito target, usato per risolvere URL relativi
  const base = url;

  // ── LOGO ──────────────────────────────────────────────────────
  const logoUrls = new Set();
  const logoSelectors = [
    'img[class*="logo" i]', 'img[id*="logo" i]', 'img[alt*="logo" i]',
    'a[class*="logo" i] img', 'a[href="/"] img',
    'header img', 'nav img', '.navbar img', '.header img', '.site-header img',
  ];
  for (const sel of logoSelectors) {
    doc.querySelectorAll(sel).forEach(el => {
      // getAttribute() invece di .src — evita che il browser risolva su localhost
      const raw = rawAttr(el, 'src', 'data-src', 'data-lazy-src', 'data-original');
      const u = resolveUrl(raw, base);
      if (u) logoUrls.add(u);
    });
  }
  doc.querySelectorAll('link[rel*="icon"], link[rel*="apple-touch-icon"]').forEach(el => {
    const raw = rawAttr(el, 'href');
    const u = resolveUrl(raw, base);
    if (u) logoUrls.add(u);
  });

  // ── COVER ─────────────────────────────────────────────────────
  const coverUrls = new Set();
  ['og:image','twitter:image','twitter:image:src'].forEach(m => {
    const el = doc.querySelector(`meta[property="${m}"], meta[name="${m}"]`);
    const v = el?.getAttribute('content');
    const u = resolveUrl(v, base);
    if (u) coverUrls.add(u);
  });
  doc.querySelectorAll('[class*="hero" i] img, [class*="banner" i] img, [class*="cover" i] img, section:first-of-type img').forEach(el => {
    const raw = rawAttr(el, 'src', 'data-src', 'data-lazy-src', 'data-original');
    const u = resolveUrl(raw, base);
    if (u && !logoUrls.has(u)) coverUrls.add(u);
  });

  // ── GALLERY ───────────────────────────────────────────────────
  const galleryUrls = new Set();
  doc.querySelectorAll('img').forEach(el => {
    const raw = rawAttr(el, 'src', 'data-src', 'data-lazy-src', 'data-original', 'data-lazy');
    const u = resolveUrl(raw, base);
    if (u && !logoUrls.has(u) && !coverUrls.has(u)) galleryUrls.add(u);
  });
  // srcset
  doc.querySelectorAll('img[srcset], source[srcset]').forEach(el => {
    const srcset = el.getAttribute('srcset') || '';
    srcset.split(',').forEach(part => {
      const raw = part.trim().split(/\s+/)[0];
      const u = resolveUrl(raw, base);
      if (u && !logoUrls.has(u) && !coverUrls.has(u)) galleryUrls.add(u);
    });
  });
  // CSS background inline
  doc.querySelectorAll('[style*="background"]').forEach(el => {
    const style = el.getAttribute('style') || '';
    const m = style.match(/url\(['"]?([^'")\s]+)['"]?\)/);
    if (m) {
      const u = resolveUrl(m[1], base);
      if (u && !logoUrls.has(u) && !coverUrls.has(u)) galleryUrls.add(u);
    }
  });

  const logoList    = [...logoUrls].slice(0, 6);
  const coverList   = [...coverUrls].slice(0, 6);
  const galleryList = [...galleryUrls].filter(u => !coverList.includes(u)).slice(0, 80);

  setProgress(40);
  renderLogos(logoList);
  renderGrid('coverContainer', coverList, 'cover');
  renderGrid('galleryContainer', galleryList, 'gallery');
  document.getElementById('results').style.display = 'block';

  const tot = logoList.length + coverList.length + galleryList.length;
  setStatus(`✓ Trovate ${tot} immagini. Clicca per selezionare, poi scarica il ZIP.`);
  setProgress(100);
  setTimeout(() => setProgress(null), 600);
  document.getElementById('fetchBtn').disabled = false;
  updateBar();
}

function renderLogos(urls) {
  const container = document.getElementById('logoContainer');
  container.innerHTML = '';
  if (!urls.length) { container.innerHTML = '<p class="empty-msg">Nessun logo rilevato.</p>'; return; }
  urls.forEach(url => {
    const card = document.createElement('div');
    card.className = 'logo-card';
    const img = document.createElement('img');
    img.src = PROXY(url);
    img.alt = '';
    img.onerror = () => card.remove();
    card.appendChild(img);
    card.addEventListener('click', () => toggleCard(card, url, 'logo'));
    container.appendChild(card);
    allImages.push({ url, category: 'logo', card });
  });
}

function renderGrid(containerId, urls, category) {
  const container = document.getElementById(containerId);
  container.innerHTML = '';
  if (!urls.length) { container.innerHTML = '<p class="empty-msg">Nessuna immagine trovata.</p>'; return; }
  urls.forEach(url => {
    const card = document.createElement('div');
    card.className = 'img-card';
    const img = document.createElement('img');
    img.src = PROXY(url);
    img.alt = '';
    img.loading = 'lazy';
    img.onerror = () => card.remove();
    const badge = document.createElement('div');
    badge.className = 'badge';
    try { badge.textContent = decodeURIComponent(url.split('/').pop().split('?')[0]) || url; } catch { badge.textContent = url; }
    card.appendChild(img);
    card.appendChild(badge);
    card.addEventListener('click', () => toggleCard(card, url, category));
    container.appendChild(card);
    allImages.push({ url, category, card });
  });
}

function toggleCard(card, url, category) {
  if (selectedImages.has(url)) {
    selectedImages.delete(url);
    card.classList.remove('selected');
  } else {
    selectedImages.add(url);
    card.classList.add('selected');
  }
  updateBar();
}

function updateBar() {
  document.getElementById('selNum').textContent = selectedImages.size;
  document.getElementById('downloadBar').classList.toggle('show', selectedImages.size > 0);
}

function toggleSelectAll() {
  allSelected = !allSelected;
  allImages.forEach(({ url, card }) => {
    if (!document.body.contains(card)) return;
    if (allSelected) { selectedImages.add(url); card.classList.add('selected'); }
    else { selectedImages.delete(url); card.classList.remove('selected'); }
  });
  document.getElementById('selectAllBtn').textContent = allSelected ? 'Deseleziona tutto' : 'Seleziona tutto';
  updateBar();
}

async function downloadZip() {
  if (!selectedImages.size) return;
  const btn = document.getElementById('downloadBtn');
  btn.disabled = true;
  btn.textContent = '⏳ Creo ZIP…';

  const zip = new JSZip();
  const folders = { logo: zip.folder('logo'), cover: zip.folder('cover'), gallery: zip.folder('gallery') };
  const selected = allImages.filter(i => selectedImages.has(i.url));
  let done = 0;

  for (const item of selected) {
    try {
      const resp = await fetch(PROXY(item.url));
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const blob = await resp.blob();
      const raw = item.url.split('?')[0];
      const ext = raw.split('.').pop().toLowerCase().replace(/[^a-z0-9]/g, '') || 'jpg';
      folders[item.category].file(`${item.category}_${String(done+1).padStart(3,'0')}.${ext}`, blob);
    } catch(e) {
      console.warn('Skip:', item.url, e.message);
    }
    done++;
    setStatus(`<span class="spinner"></span>Download ${done}/${selected.length}…`);
    setProgress(Math.round((done / selected.length) * 100));
  }

  const content = await zip.generateAsync({ type: 'blob', compression: 'DEFLATE' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(content);
  try {
    const domain = new URL(document.getElementById('urlInput').value).hostname.replace('www.', '');
    a.download = `imagerip_${domain}.zip`;
  } catch { a.download = 'imagerip.zip'; }
  a.click();

  setProgress(null);
  setStatus(`✓ ZIP scaricato! (${selected.length} immagini)`);
  btn.disabled = false;
  btn.textContent = '⬇ Scarica ZIP';
}
</script>
</body>
</html>
